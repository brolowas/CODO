
name: Build KODO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract KODO source archive
        run: |
          test -f KODO_0_6_Android_Project.zip
          unzip -q KODO_0_6_Android_Project.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: KODO_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KODO-debug-apk
          path: KODO_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
